[project]
name = "reminder-backend"
version = "0.1.0"
description = "Reminder habit tracker: HTTP API and Telegram worker"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.0",
    "python-dateutil>=2.9.0.post0",
    "sqlalchemy[asyncio]>=2.1.5",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
reminder = "src.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-python-dateutil>=2.9.0.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Russian user-facing texts contain Cyrillic letters that look like Latin ones.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI / Typer declare dependencies and options as default arguments.
"src/api/**" = ["B008"]
"src/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
